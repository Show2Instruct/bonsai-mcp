name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: test, package, and attach the add-on zip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install the project
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests blender_addon scripts
      - name: Test (pytest)
        run: pytest
      - name: Check tag matches the package version
        run: |
          version=$(python -c "import bonsai_mcp; print(bonsai_mcp.__version__)")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version v$version"
            exit 1
          fi
      - name: Build the add-on zip (version-checked)
        run: python scripts/package_addon.py --check
      - name: Create the GitHub release with the zip attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/bonsai_mcp_bridge-*.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
