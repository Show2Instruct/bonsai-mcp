name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install the project
        run: uv pip install --system -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check src tests blender_addon scripts
      - name: Test (pytest)
        run: pytest

  floor:
    name: dependency floor (mcp==1.7.0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.10"
      - name: Install with the lowest declared mcp
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system "mcp==1.7.0"
      - name: Test against the dependency floor
        run: pytest
